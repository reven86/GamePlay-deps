name: Multi-Platform CMake Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:  # Manual trigger

env:
  S3_REGION: ${{ secrets.S3_REGION || 'eu-central-003' }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  AWS_ENDPOINT: ${{ secrets.S3_ENDPOINT }}

jobs:
  build-linux:
    if: false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build zip

    - name: Configure CMake
      run: |
        cmake -B build-${{ matrix.build_type }} \
              -S . \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -G Ninja

    - name: Build project
      run: |
        cmake --build build-${{ matrix.build_type }} \
              --config ${{ matrix.build_type }} \
              --parallel $(nproc)

    - name: Package build
      run: |
        cd out
        zip -r ../${{ github.event.repository.name }}-linux-${{ matrix.build_type }}.zip .

    - name: Upload to S3
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.S3_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.S3_REGION }}
      run: |
        aws s3 cp ${{ github.event.repository.name }}-linux-${{ matrix.build_type }}.zip \
          s3://${{ env.S3_BUCKET }}/builds/

  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        android_abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK and CMake
      run: |
        sdkmanager "cmake;3.22.1" "ndk;26.3.11579264"

    - name: Configure Android build
      run: |
        cmake -B build-android-${{ matrix.android_abi }} \
              -S . \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=${{ matrix.android_abi }} \
              -DANDROID_FORCE_ARM_BUILD=ON \
              -DANDROID_PLATFORM=android-24 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release

    - name: Build Android
      run: |
        cmake --build build-android-${{ matrix.android_abi }} --parallel $(nproc)

    - name: Package Android build
      run: |
        cd build-android-${{ matrix.android_abi }}/out
        zip -r ../${{ github.event.repository.name }}-android-${{ matrix.android_abi }}.zip .

    - name: Upload Android to S3
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.S3_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.S3_REGION }}
      run: |
        aws s3 cp ${{ github.event.repository.name }}-android-${{ matrix.android_abi }}.zip \
          s3://${{ env.S3_BUCKET }}/builds/

  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake ninja

    - name: Configure iOS build
      run: |
        cmake -B build-ios \
              -S . \
              -DPLATFORM=OS \
              -DDEPLOYMENT_TARGET=12.0 \
              -DCMAKE_TOOLCHAIN_FILE=cmake/ios.toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release

    - name: Build iOS
      run: |
        cmake --build build-ios --parallel $(sysctl -n hw.ncpu)

    - name: Package iOS build
      run: |
        cd build-ios/out
        zip -r ../${{ github.event.repository.name }}-ios.zip .

    - name: Upload iOS to S3
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.S3_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.S3_REGION }}
      run: |
        aws s3 cp ${{ github.event.repository.name }}-ios.zip \
          s3://${{ env.S3_BUCKET }}/builds/

  build-emscripten:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v13

    - name: Configure Emscripten build
      run: |
        emcmake cmake -B build-emscripten \
                      -S . \
                      -DCMAKE_BUILD_TYPE=MinSizeRel

    - name: Build Emscripten
      run: |
        cmake --build build-emscripten --parallel $(nproc)

    - name: Package Emscripten build
      run: |
        cd build-emscripten/out
        zip -r ../${{ github.event.repository.name }}-emscripten.zip .

    - name: Upload Emscripten to S3
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.S3_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.S3_REGION }}
      run: |
        aws s3 cp ${{ github.event.repository.name }}-emscripten.zip \
          s3://${{ env.S3_BUCKET }}/builds/

  build-emscripten-mod:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v13
      with:
        version: 3.1.50

    - name: Configure Emscripten build
      run: |
        emcmake cmake -B build-emscripten \
                      -S . \
                      -DCMAKE_BUILD_TYPE=MinSizeRel

    - name: Build Emscripten
      run: |
        cmake --build build-emscripten --parallel $(nproc)

    - name: Package Emscripten build
      run: |
        cd build-emscripten/out
        zip -r ../${{ github.event.repository.name }}-emscripten-mod.zip .

    - name: Upload Emscripten to S3
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.S3_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.S3_REGION }}
      run: |
        aws s3 cp ${{ github.event.repository.name }}-emscripten-mod.zip \
          s3://${{ env.S3_BUCKET }}/builds/

  deploy-summary:
    runs-on: ubuntu-latest
    needs: [build-linux, build-android, build-ios, build-emscripten]
    
    steps:
    - name: Create deployment summary
      run: |
        echo "Build completed for all platforms!" > summary.md
        echo "Commit: ${{ github.sha }}" >> summary.md
        echo "Build artifacts uploaded to S3 bucket: ${{ env.S3_BUCKET }}" >> summary.md

    - name: Upload summary
      uses: actions/upload-artifact@v4
      with:
        name: build-summary
        path: summary.md